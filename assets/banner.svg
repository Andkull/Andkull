<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-labelledby="title desc">
  <title id="title">Andkull</title>
  <desc id="desc">Blockchain &amp; web developer</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c5cff">
        <animate attributeName="stop-color" values="#7c5cff;#22d3ee;#7c5cff" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#22d3ee">
        <animate attributeName="stop-color" values="#22d3ee;#7c5cff;#22d3ee" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <clipPath id="frame"><rect width="1000" height="240" rx="16"/></clipPath>
  </defs>

  <style>
    .name { font: 700 64px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; letter-spacing: 2px; }
    .role { font: 400 24px 'Cascadia Code', 'Fira Code', Consolas, monospace; fill: #c9d1d9; }
    .caret { fill: #22d3ee; animation: blink 1s steps(1) infinite; }
    .typed { animation: reveal 2.4s steps(28) 0.6s both; }
    .fade { animation: fade 1.2s ease-out both; }
    .block { fill: none; stroke: #7c5cff; stroke-width: 2; opacity: 0.35; }
    .link { stroke: #22d3ee; stroke-width: 2; stroke-dasharray: 6 6; opacity: 0.5; animation: dash 1.5s linear infinite; }
    .b1 { animation: pulse 3s ease-in-out infinite; }
    .b2 { animation: pulse 3s ease-in-out 1s infinite; }
    .b3 { animation: pulse 3s ease-in-out 2s infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes reveal { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
    @keyframes fade { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes dash { to { stroke-dashoffset: -12; } }
    @keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.8; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1000" height="240" fill="url(#bg)"/>

    <!-- chain of blocks on the right -->
    <g transform="translate(690 70)">
      <line class="link" x1="70" y1="50" x2="100" y2="50"/>
      <line class="link" x1="170" y1="50" x2="200" y2="50"/>
      <rect class="block b1" x="0" y="15" width="70" height="70" rx="10"/>
      <rect class="block b2" x="100" y="15" width="70" height="70" rx="10"/>
      <rect class="block b3" x="200" y="15" width="70" height="70" rx="10"/>
    </g>

    <g class="fade">
      <text class="name" x="60" y="118" fill="url(#accent)">Andkull</text>
    </g>

    <g transform="translate(62 168)">
      <text class="role typed" x="0" y="0">&gt; blockchain &amp; web developer</text>
      <rect class="caret" x="0" y="-20" width="12" height="24">
        <animate attributeName="x" values="0;410" dur="2.4s" begin="0.6s" fill="freeze"/>
      </rect>
    </g>

    <rect x="60" y="196" width="120" height="3" rx="1.5" fill="url(#accent)"/>
  </g>
</svg>
